<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Singularity City</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #060610;
    color: #e2e8f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
  }
  .wrap { max-width: 420px; padding: 24px; }
  .code {
    font-size: 80px;
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(135deg, #f43f5e, #8b5cf6, #22d3ee);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 16px;
  }
  h1 { font-size: 18px; color: #94a3b8; margin-bottom: 12px; font-weight: 400; }
  p { font-size: 13px; color: #64748b; line-height: 1.6; margin-bottom: 24px; }
  a {
    display: inline-block;
    padding: 10px 28px;
    background: rgba(244, 63, 94, 0.12);
    border: 1px solid rgba(244, 63, 94, 0.3);
    border-radius: 6px;
    color: #f43f5e;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  a:hover { background: rgba(244, 63, 94, 0.2); border-color: rgba(244, 63, 94, 0.5); }
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>This district doesn't exist yet.</h1>
  <p>The city is always expanding, but this particular block hasn't been built. Head back to the main city.</p>
  <a href="/">Enter Singularity City</a>
</div>
</body>
</html>
